# =============================================================================
#  Transcribe configuration
# =============================================================================
# This file is copied out of the plugin jar the first time Transcribe starts
# (JavaPlugin#saveDefaultConfig) and is never overwritten automatically after
# that, so it's safe to edit in place. Re-run /transcribe reload (or a
# server restart) after changing anything here.
#
# YAML gotchas worth knowing before you edit this file:
#   - Indentation is 2 spaces, and must be consistent and do not use tabs.
#   - Strings containing `%`, `:` or leading/trailing spaces should be quoted,
#     e.g. "effect give %player% minecraft:glowing 5 0 true".
#   - Booleans are bare `true`/`false` (no quotes). Everything under
#     `activation.placeholderapi.expected-value` is compared as a *string*,
#     so quote it even though it reads like a boolean.

# How much Transcribe logs to console, so you can see what it's actually
# doing (or confirm it's doing nothing, and why). All debug lines are
# prefixed "[Transcribe debug]" and logged at INFO level (so they show up
# even if your host's log level filters out FINE/DEBUG). Takes effect
# immediately on /transcribe reload - no restart needed.
#   0 - off (default). Only the normal enable/disable/reload lines log.
#   1 - lifecycle: Listen Windows opening, and each recognition result
#       ("'fire'" or "(no keyword recognized)") with how long it took.
#       Enough to answer "is it doing anything at all?"
#   2 - + trigger detail: which specific trigger fired and for whom, windows
#       that refreshed instead of opening, PlaceholderAPI polling, and audio
#       capture sessions opening/closing with total samples captured.
#   3 - + per-packet audio: every individual microphone packet decoded, with
#       byte/sample counts. Very chatty - only for deep troubleshooting of
#       the SVC <-> opus4j audio pipeline itself.
debug:
  level: 0

# which speech-to-text backend transcribes captured voice audio, and
# how that backend is configured.
engine:

  # Which SpeechRecognitionEngine implementation to use. One of:
  #
  #   INTERNAL - Embeds Vosk (JNI/native offline STT) directly in this JVM.
  #     + No external process to run, deploy, or keep alive.
  #     + No network hop, so lower latency and nothing to leak audio to.
  #     - Uses server CPU/RAM for every recognition (mitigated heavily by the
  #       constrained grammar below - idle cost is effectively zero).
  #     - You must download and unpack a Vosk acoustic model onto this server
  #       (see engine.internal.model-path).
  #
  #   EXTERNAL - Streams PCM audio to a separate STT microservice over a
  #     WebSocket connection (see server.py shipped alongside this plugin for
  #     a complete, drop-in reference implementation of that service).
  #     + Keeps the Paper server's own CPU/RAM footprint minimal.
  #     + The STT backend can be swapped, scaled, or run on dedicated/GPU
  #       hardware independently of the Minecraft server.
  #     - Adds a network hop (latency + a new failure mode to monitor).
  #     - You are responsible for running, securing, and keeping that service
  #       online (server.py is a reference/demo, not a hardened deployment).
  #
  # Changing this value requires a plugin reload/restart to take effect.
  mode: INTERNAL

  # The sample rate, in Hz, that captured PCM audio is delivered at before
  # being handed to either engine. Both engines resample internally if their
  # own expected rate differs (Vosk models almost always expect 16000; the
  # bundled server.py reference implementation also defaults to 16000), so
  # you generally only need to change this if you know Simple Voice Chat's
  # capture pipeline on your server is configured differently.
  sample-rate-hertz: 16000

  # settings used only when engine.mode is INTERNAL.
  internal:

    # Path to an *unpacked* Vosk model directory (the folder containing
    # am/, graph/, conf/, etc.), resolved relative to this plugin's own data
    # folder - i.e. plugins/Transcribe/<model-path>.
    # Download a model from https://alphacephei.com/vosk/models, for a
    # keyword only grammar like this plugin uses, one of the small ~40-50MB
    # models (e.g. vosk-model-small-en-us-0.15) is more than sufficient.
    # You do not need a large general-purpose model.
    model-path: models/vosk-model-small-en-us-0.15

    # The constrained vocabulary the recognizer is limited to. This is the
    # single biggest lever on both CPU usage and recognition accuracy:
    # restricting Vosk to a handful of words (rather than its full open
    # vocabulary) collapses the decoder's search space to almost nothing,
    # which is what keeps idle/background CPU usage near zero even while
    # actively listening.
    #
    # Rules of thumb when choosing words:
    #   - Prefer short, phonetically distinct words. "fire" and "light" are
    #     easy for the recognizer to tell apart; "fire" and "fyre" are not.
    #   - Every word here should correspond to something your server actually
    #     reacts to (see recognition.console-commands below, or a listener
    #     for VoiceWordSpokenEvent registered by another plugin).
    #   - Casing doesn't matter; everything is normalized to lowercase.
    #   - This list feeds directly into Vosk's JSON grammar array, e.g.
    #     ["fire", "light", "ice"] - keep entries simple, single words.
    grammar:
      - fire    # example: fire/damage spell
      - light    # example: light-giving spell
      - ice   # example: ice/slow spell

  # settings used only when engine.mode is EXTERNAL.
  external:

    # ws:// (plain) or wss:// (TLS) URI of the external STT microservice.
    # The bundled server.py listens on ws://<host>:2700 by default, matching
    # this default. If the microservice is not on the same machine/network
    # as this Paper server, strongly prefer wss:// with a reverse proxy
    # terminating TLS (raw, unencrypted voice audio should never cross an
    # untrusted network).
    uri: ws://localhost:2700

    # How long, in milliseconds, Transcribe will wait for a transcription
    # result after sending a segment before giving up on that one request.
    # This bounds worst-case latency if the remote service hangs or the
    # connection silently drops; it does not affect already-completed
    # requests or healthy connections.
    request-timeout-millis: 5000


#  what opens a player's "Listen Window" - the short interval during which their voice audio is captured and decoded.
activation:

  # How long a triggered Listen Window stays open, in seconds.
  window-seconds: 3.0

  # Active client action triggers. Options:
  #   - SWAP_HAND          (Pressing F)
  #   - SNEAK_SWAP_HAND    (Pressing Shift + F)
  #   - LEFT_CLICK         (Left Clicking)
  #   - SNEAK_LEFT_CLICK   (Pressing Shift + Left Click)
  #   - RIGHT_CLICK        (Right Clicking)
  #   - SNEAK_RIGHT_CLICK  (Pressing Shift + Right Click)
  #   - HOTBAR_SLOT        (Switching to slots in hotbar-slots below)
  # Note: LEFT_CLICK/SNEAK_LEFT_CLICK fire for left-clicking air or a block, but
  # NOT for left-clicking (attacking) an entity - Bukkit doesn't emit a click
  # event for that case, only a damage event, which this plugin doesn't hook.
  triggers:
    - "SNEAK_SWAP_HAND"

  # Active when HOTBAR_SLOT is included in triggers. Hotbar slots 1 through 9.
  hotbar-slots:
    - 9

  # Whether gesture actions (like Swap Hand F or Drop Item Q) should be cancelled
  # so players don't actually drop items/swap hands when triggering activation.
  cancel-trigger-events: true

  # Visual and auditory feedback when a Listen Window opens and closes. The
  # open cue plays a pling and shows "Listening..." in the actionbar; the
  # close cue (sound only, gated by the same `sound` flag) plays a lower,
  # quieter bass note so open/close are distinguishable by ear.
  feedback:
    actionbar: true
    sound: true

  # PlaceholderAPI Condition Trigger
  placeholderapi:
    placeholder: ''
    expected-value: 'true'
    poll-interval-ticks: 10


# what happens when the active engine successfully recognizes
#  an in-grammar keyword from a player's captured audio.
recognition:

  # Console commands dispatched (as the server console, i.e. full permission)
  # once per recognized keyword, in the order listed. VoiceWordSpokenEvent is
  # always fired first and can be cancelled by another plugin to suppress
  # this dispatch entirely (e.g. to implement cooldowns, mana costs, or
  # silencing effects) - if it's cancelled, none of these commands run.
  #
  # Two placeholders are substituted in every command before it runs:
  #   %player%   -> the exact in-game name of the player who spoke
  #   %keyword%  -> the recognized keyword (always one entry from
  #                 engine.internal.grammar / whatever your external service
  #                 returns), always lowercase
  #
  # This example plainly applies a visible effect for every recognized word
  # regardless of which one it was; a real spell setup would typically use a
  # dispatcher command/plugin that branches on %keyword% (or register
  # multiple VoiceWordSpokenEvent listeners that check getKeyword()) rather
  # than hard-coding one command per spell here - but simple per-keyword
  # entries work fine too, for example:
  #   - "execute if score %player% transcribe_keyword_fire matches 1 run ..."
  # or, more simply, running a single command that always delegates the
  # branching logic to another plugin:
  #   - "spellcast trigger %player% %keyword%"
  console-commands:
    - "effect give %player% minecraft:glowing 5 0 true"