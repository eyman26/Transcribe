name: Transcribe
version: '${version}'
main: org.eyman_.TranscribePlugin
api-version: '1.21'
author: Transcribe
description: Transcribe - Voice-activated spell casting for Paper, powered by Simple Voice Chat and Vosk/external STT.
depend: [voicechat]
softdepend: [PlaceholderAPI]

commands:
  transcribe:
    description: Manage the Transcribe plugin.
    usage: /<command> reload
    permission: transcribe.reload
    permission-message: You do not have permission to use this command.

permissions:
  transcribe.reload:
    description: Allows reloading Transcribe's configuration without a server restart.
    default: op
